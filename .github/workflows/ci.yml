name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Type-check, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check (server + client)
        run: npm run typecheck

      - name: API tests
        run: npm test

      - name: Build storefront
        run: npm run build

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: storefront-dist
          path: client/dist
          retention-days: 7
